<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1e2e"/>
      <stop offset="100%" stop-color="#0f0f17"/>
    </linearGradient>
    <linearGradient id="btn" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2a2b3d"/>
      <stop offset="100%" stop-color="#1a1b26"/>
    </linearGradient>
    <linearGradient id="cyan-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#4facfe"/>
    </linearGradient>
    <linearGradient id="amber-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffb300"/>
      <stop offset="100%" stop-color="#ff8f00"/>
    </linearGradient>
  </defs>

  <!-- Keycap base -->
  <rect x="18" y="18" width="220" height="220" rx="42" fill="url(#bg)" stroke="#383a59" stroke-width="4"/>
  <rect x="28" y="26" width="200" height="196" rx="34" fill="url(#btn)"/>

  <!-- English 'A' -->
  <text x="82" y="112" font-family="system-ui, -apple-system, sans-serif" font-size="72" font-weight="900" fill="url(#cyan-glow)" text-anchor="middle">A</text>

  <!-- Hebrew 'ע' -->
  <text x="174" y="115" font-family="system-ui, -apple-system, sans-serif" font-size="70" font-weight="900" fill="url(#amber-glow)" text-anchor="middle">ע</text>

  <!-- Arrows -->
  <path d="M75 168 L181 168" stroke="url(#cyan-glow)" stroke-width="8" stroke-linecap="round"/>
  <path d="M165 155 L182 168 L165 181" fill="none" stroke="url(#cyan-glow)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M181 192 L75 192" stroke="url(#amber-glow)" stroke-width="8" stroke-linecap="round"/>
  <path d="M91 179 L74 192 L91 205" fill="none" stroke="url(#amber-glow)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
