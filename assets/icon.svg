<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient: Sky Blue to Violet/Purple -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#A855F7"/>
    </linearGradient>

    <!-- Keycap Dropshadow -->
    <filter id="tileShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0F0A28" flood-opacity="0.3"/>
    </filter>

    <!-- Badge Dropshadow -->
    <filter id="badgeShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0A051E" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Outer squircle background -->
  <rect x="18" y="18" width="476" height="476" rx="112" fill="url(#bgGrad)" stroke="rgba(255,255,255,0.4)" stroke-width="6"/>

  <!-- English Tile 1 (Top Left) -->
  <rect x="36" y="41" width="256" height="256" rx="72" fill="rgba(255,255,255,0.94)" stroke="#FFFFFF" stroke-width="6"/>
  <!-- Bold 'A' -->
  <text x="164" y="215" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="190" font-weight="900" fill="#0284C7" text-anchor="middle">A</text>

  <!-- Hebrew Tile 2 (Bottom Right) with Drop Shadow -->
  <g filter="url(#tileShadow)">
    <rect x="220" y="215" width="256" height="256" rx="72" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="6"/>
    <!-- Bold 'א' -->
    <text x="348" y="392" font-family="Arial, 'Segoe UI', system-ui, sans-serif" font-size="190" font-weight="900" fill="#7C3AED" text-anchor="middle">א</text>
  </g>

  <!-- Center Switch Badge -->
  <g filter="url(#badgeShadow)">
    <circle cx="256" cy="256" r="64" fill="#38BDF8" stroke="#FFFFFF" stroke-width="8"/>
    <!-- Top Arrow (Left to Right) -->
    <line x1="216" y1="244" x2="296" y2="244" stroke="#FFFFFF" stroke-width="12" stroke-linecap="round"/>
    <polyline points="280,228 298,244 280,260" fill="none" stroke="#FFFFFF" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Bottom Arrow (Right to Left) -->
    <line x1="296" y1="268" x2="216" y2="268" stroke="#FFFFFF" stroke-width="12" stroke-linecap="round"/>
    <polyline points="232,252 214,268 232,284" fill="none" stroke="#FFFFFF" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
